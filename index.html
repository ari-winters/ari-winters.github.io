<html>
    <link rel="stylesheet" href="style.css">
    <h1>
        <span data-value="LOST IN TRANSLATION" class="anim-text">LOST ABOUND MEANING</span>
    </h1>
    <h1>
        <span data-value="LOST ABOUND MEANING" class="anim-text">LOST IN TRANSLATION</span>
    </h1>
</html>

<script>
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    const allAnimatedElements = document.querySelectorAll(".anim-text");

    allAnimatedElements.forEach(element => {
        element.addEventListener("mouseover", (event) => {
            let iterations = 0;
            const interval = setInterval(() => {
                event.target.innerText = event.target.innerText.split("")
                .map((letter, index) => {
                    if(index < iterations) {
                        return event.target.dataset.value[index];
                    }
                    return letters[Math.floor(Math.random() * 26)]
                })
                .join("");
                if(iterations >= event.target.dataset.value.length) clearInterval(interval);
                iterations += 1/3;
            }, 30);
        });

    });
</script>
